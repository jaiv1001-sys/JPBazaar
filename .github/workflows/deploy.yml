name: JPBazaar Production Deployment

on:
  workflow_run:
    workflows: ["JPBazaar CI Pipeline"]
    branches: [ main ]
    types:
      - completed

jobs:
  deploy-backend:
    name: Deploy Backend to Render / Railway
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment hook..."
          curl -X POST -f "${RENDER_DEPLOY_HOOK_URL}"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Vercel Deploy Hook
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel deployment hook..."
          curl -X POST -f "${VERCEL_DEPLOY_HOOK_URL}"
