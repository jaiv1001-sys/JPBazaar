spring:
  application:
    name: jpbazaar
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jpbazaar}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: JPBazaarHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 25
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 600000 # 10 minutes in ms
      cache-null-values: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:concierge@jpbazaar.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: JPBazaar E-Commerce API
    description: Production-grade Spring Boot 3 & Java 21 REST API
    version: 1.0.0

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours in Milliseconds

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_JPBazaarDemoKey123}
  key-secret: ${RAZORPAY_KEY_SECRET:JPBazaarDemoSecretKey456}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:JPBazaarWebhookSecret789}
  currency: ${RAZORPAY_CURRENCY:INR}
  enabled: ${RAZORPAY_ENABLED:true}

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads/images}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:concierge@jpbazaar.com}
    from-name: ${APP_MAIL_FROM_NAME:JPBazaar Luxury Concierge}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      use-redis: ${RATE_LIMIT_USE_REDIS:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.jpbazaar: DEBUG
    org.hibernate.SQL: INFO
