spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jpbazaar}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root@jp}

  cache:
    type: ${CACHE_TYPE:simple}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_JPBazaarDemoKey123}
  key-secret: ${RAZORPAY_KEY_SECRET:JPBazaarDemoSecretKey456}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:JPBazaarWebhookSecret789}
  currency: ${RAZORPAY_CURRENCY:INR}
  enabled: ${RAZORPAY_ENABLED:true}

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:concierge@jpbazaar.com}
    from-name: ${APP_MAIL_FROM_NAME:JPBazaar Luxury Concierge}

logging:
  level:
    com.jpbazaar: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

